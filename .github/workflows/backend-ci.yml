name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Build, unit tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Capstone.sln

      - name: Build
        run: dotnet build Capstone.sln -c Release --no-restore

      - name: Run unit tests and coverage gate
        shell: pwsh
        run: ./scripts/Test-WithCoverage.ps1 -Configuration Release -NoBuild

      - name: Publish coverage summary
        if: always()
        shell: pwsh
        run: |
          $summary = "artifacts/coverage/gate/SummaryGithub.md"
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 14

  backend-integration-tests:
    name: HTTP integration tests against real Postgres and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: apcs
          POSTGRES_PASSWORD: apcs
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apcs -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The committed schema dump sets transaction_timeout, which is Postgres 17+,
      # so the container must not be downgraded below 18.
      APCS_TEST_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=apcs;Username=apcs;Password=apcs;SSL Mode=Disable"
      APCS_TEST_REDIS_CONNECTION_STRING: "127.0.0.1:6379,abortConnect=false"
      # Opt-in truncation so each test class starts clean. The tests only truncate
      # when this matches the database named in the connection string.
      APCS_TEST_RESET_DATABASE: apcs
      DOTNET_ROOT: /usr/share/dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Prepare test database
        run: ./scripts/e2e/bootstrap-test-db.sh

      - name: Build
        run: dotnet build Capstone.sln -c Release

      - name: Run integration tests
        run: dotnet test Capstone.sln -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
