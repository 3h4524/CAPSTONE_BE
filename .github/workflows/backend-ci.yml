name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Build, unit tests, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Capstone.sln

      - name: Build
        run: dotnet build Capstone.sln -c Release --no-restore

      - name: Run unit tests and coverage gate
        shell: pwsh
        run: ./scripts/Test-WithCoverage.ps1 -Configuration Release -NoBuild

      - name: Publish coverage summary
        if: always()
        shell: pwsh
        run: |
          $summary = "artifacts/coverage/gate/SummaryGithub.md"
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 14

  backend-integration-tests:
    name: HTTP integration tests against real Postgres and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: apcs
          POSTGRES_PASSWORD: apcs
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apcs -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The committed schema dump sets transaction_timeout, which is Postgres 17+,
      # so the container must not be downgraded below 18.
      APCS_TEST_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=apcs;Username=apcs;Password=apcs;SSL Mode=Disable"
      APCS_TEST_REDIS_CONNECTION_STRING: "127.0.0.1:6379,abortConnect=false"
      APCS_TEST_DISPATCHER_POSTGRES: "Host=127.0.0.1;Port=5432;Database=postgres;Username=apcs;Password=apcs;SSL Mode=Disable"
      APCS_TEST_DISPATCHER_REDIS: "127.0.0.1:6379,abortConnect=false"
      APCS_TEST_REDIS_URL: "redis://127.0.0.1:6379"
      # Opt-in truncation so each test class starts clean. The tests only truncate
      # when this matches the database named in the connection string.
      APCS_TEST_RESET_DATABASE: apcs
      DOTNET_ROOT: /usr/share/dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Prepare test database
        run: ./scripts/e2e/bootstrap-test-db.sh

      - name: Build
        run: dotnet build Capstone.sln -c Release

      # Provision the shared test database before solution-wide projects run in parallel.
      - name: Prepare application schema
        run: dotnet test tests/APCS.Infrastructure.IntegrationTests/APCS.Infrastructure.IntegrationTests.csproj -c Release --no-build -- --filter "FullyQualifiedName~MediaJobRepositoryTests"

      - name: Run integration tests
        run: dotnet test Capstone.sln -c Release --no-build -- --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-worker/package-lock.json

      - name: Run media worker tests
        working-directory: media-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-results
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

  migrations:
    name: Flyway migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create extensions
        if: hashFiles('migrations/**/*.sql') != ''
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d apcs -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Migrate an empty database and validate
        if: hashFiles('migrations/**/*.sql') != ''
        env:
          FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/apcs
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: postgres
        run: |
          ./deploy/scripts/flyway.sh migrate
          ./deploy/scripts/flyway.sh validate
          ./deploy/scripts/flyway.sh info >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Dependency audit and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      AUDIT_REPORT: /tmp/security-audit.md
      TRIVY_REPORT: /tmp/security-trivy.md

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Restore the API
        run: dotnet restore API/API.csproj

      - name: Audit NuGet and media worker packages
        id: audit
        continue-on-error: true
        run: |
          status=0
          GITHUB_STEP_SUMMARY="$AUDIT_REPORT" ./deploy/scripts/security-audit.sh audit nuget:API/API.csproj npm:media-worker || status=$?
          cat "$AUDIT_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install Trivy
        run: |
          curl --proto "=https" --tlsv1.2 -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan the repository for vulnerabilities and secrets
        id: trivy
        continue-on-error: true
        run: |
          ./deploy/scripts/security-audit.sh trivyignore > /tmp/trivyignore
          status=0
          trivy fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /tmp/trivyignore --format table --output /tmp/trivy-fs.txt . || status=$?
          { echo "## Trivy: repository"; echo '```'; cat /tmp/trivy-fs.txt; echo '```'; } > "$TRIVY_REPORT"
          cat "$TRIVY_REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: ./deploy/scripts/security-pr-comment.sh

      - name: Fail on findings
        if: steps.audit.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: |
          echo "::error::High or critical findings. Upgrade the package, or add an entry with a reason and an expiry date to security-acceptances.json."
          exit 1
