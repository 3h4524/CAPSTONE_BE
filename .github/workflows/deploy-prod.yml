name: Deploy production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: What to release from the selected tag
        type: choice
        options: [api, infra, all]
        default: api

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/1035893227434/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SA: apcs-deployer@apcs-prod.iam.gserviceaccount.com
  RELEASE_TAG: ${{ github.ref_name }}
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  guard:
    name: Tag is on the production branch
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow from a v* tag (for a rollback, pick the older tag as the ref)."
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify the tagged commit belongs to production
        run: |
          git fetch --no-tags origin production
          if ! git merge-base --is-ancestor HEAD origin/production; then
            echo "::error::$RELEASE_TAG is not on the production branch. Merge into production first, then tag."
            exit 1
          fi

  audit:
    name: Dependency audit
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Restore the API
        run: dotnet restore API/API.csproj

      - name: Audit NuGet and media worker packages
        run: ./deploy/scripts/security-audit.sh audit nuget:API/API.csproj npm:media-worker

  sonar:
    name: Sonar security gate
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Load deployment settings
        run: grep -vE '^\s*(#|$)' deploy/env/common.env >> "$GITHUB_ENV"

      - name: Skip until Sonar is configured
        if: env.SONAR_PROJECT_KEY == ''
        run: echo "::warning::SONAR_PROJECT_KEY is empty in deploy/env/common.env, so the Sonar gate is skipped."

      - name: Authenticate to Google Cloud
        if: env.SONAR_PROJECT_KEY != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Read the Sonar token
        id: secrets
        if: env.SONAR_PROJECT_KEY != ''
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: token:${{ env.GCP_PROJECT }}/sonar-token

      - name: Set up .NET
        if: env.SONAR_PROJECT_KEY != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Analyze
        if: env.SONAR_PROJECT_KEY != ''
        env:
          SONAR_TOKEN: ${{ steps.secrets.outputs.token }}
        run: |
          dotnet tool install dotnet-sonarscanner --version "$SONAR_SCANNER_VERSION" --tool-path /tmp/sonar
          /tmp/sonar/dotnet-sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" /v:"$RELEASE_TAG" \
            /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions="docs/**,models/**,artifacts/**,**/sample-data/**"
          dotnet build Capstone.sln -c Release
          /tmp/sonar/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Check security findings in new code
        if: env.SONAR_PROJECT_KEY != ''
        env:
          SONAR_TOKEN: ${{ steps.secrets.outputs.token }}
        run: ./deploy/scripts/sonar-security-gate.sh .sonarqube/out/.sonar/report-task.txt

  images:
    name: Build, scan, and push images
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Load deployment settings
        run: grep -vE '^\s*(#|$)' deploy/env/common.env >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: API/Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/apcs-api:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/apcs-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the media worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: media-worker/Dockerfile
          load: true
          tags: |
            ${{ env.REGISTRY }}/apcs-media-worker:${{ env.RELEASE_TAG }}
            ${{ env.REGISTRY }}/apcs-media-worker:${{ github.sha }}
          cache-from: type=gha,scope=media-worker
          cache-to: type=gha,mode=max,scope=media-worker

      - name: Install Trivy
        run: |
          curl --proto "=https" --tlsv1.2 -fsSLo /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan images for vulnerabilities and secrets
        run: |
          ./deploy/scripts/security-audit.sh trivyignore > /tmp/trivyignore
          failed=0
          for image in apcs-api apcs-media-worker; do
            trivy image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /tmp/trivyignore \
              --format table --output "/tmp/$image.txt" "$REGISTRY/$image:$RELEASE_TAG" || failed=1
            { echo "## Trivy: $image"; echo '```'; cat "/tmp/$image.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Trivy found fixable HIGH/CRITICAL vulnerabilities or leaked secrets. Upgrade the package or base image, or add an entry with a reason and an expiry date to security-acceptances.json."
            exit 1
          fi

      - name: Push images
        run: |
          docker push --all-tags "$REGISTRY/apcs-api"
          docker push --all-tags "$REGISTRY/apcs-media-worker"

  deploy:
    name: Release on the VM
    needs: [guard, audit, sonar, images]
    if: >-
      always() && needs.guard.result == 'success' && (
        (needs.audit.result == 'success' && needs.sonar.result == 'success' && needs.images.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.audit.result == 'skipped' && needs.sonar.result == 'skipped' && needs.images.result == 'skipped')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Decide what to release
        id: plan
        env:
          REQUESTED: ${{ inputs.target }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            target="$REQUESTED"
          else
            previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2> /dev/null || true)"
            if [ -z "$previous" ] || ! git diff --quiet "$previous" HEAD -- \
                deploy/compose.yml deploy/Caddyfile deploy/backup deploy/postgres \
                deploy/env/compose.env.tpl deploy/env/backup.env.tpl deploy/env/redis.env.tpl deploy/env/redis-media.env.tpl deploy/env/postgres-prod.env.tpl; then
              target=all
            else
              target=api
            fi
            echo "Previous release: ${previous:-none}"
          fi
          echo "Release target: $target"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Load deployment settings
        run: grep -vE '^\s*(#|$)' deploy/env/common.env >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Ship deployment files and migrations
        run: |
          tar czf - deploy migrations | gcloud compute ssh "$VM_NAME" --zone "$GCP_ZONE" --project "$GCP_PROJECT" \
            --tunnel-through-iap --quiet --command \
            "sudo -u deploy bash -c 'set -e; rm -rf /opt/apcs/incoming/*; tar xzf - -C /opt/apcs/incoming; rsync -a --inplace --delete --exclude .env /opt/apcs/incoming/deploy/ /opt/apcs/deploy/; rsync -a --delete /opt/apcs/incoming/migrations/ /opt/apcs/migrations/'"

      - name: Release infrastructure (Caddy, Dozzle, Uptime Kuma, backup)
        if: steps.plan.outputs.target == 'infra' || steps.plan.outputs.target == 'all'
        run: |
          gcloud compute ssh "$VM_NAME" --zone "$GCP_ZONE" --project "$GCP_PROJECT" --tunnel-through-iap --quiet \
            --command "sudo -iu deploy /opt/apcs/deploy/scripts/release.sh infra"

      - name: Release the API and media worker
        if: steps.plan.outputs.target == 'api' || steps.plan.outputs.target == 'all'
        run: |
          gcloud compute ssh "$VM_NAME" --zone "$GCP_ZONE" --project "$GCP_PROJECT" --tunnel-through-iap --quiet \
            --command "sudo -iu deploy /opt/apcs/deploy/scripts/release.sh api $RELEASE_TAG"

      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$APP_DOMAIN/health"
