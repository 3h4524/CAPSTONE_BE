services:
  media-worker:
    build:
      context: ..
      dockerfile: media-worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APCS_API_URL: ${APCS_API_URL:-http://host.docker.internal:5191}
      MEDIA_WORKER_API_KEY: ${MEDIA_WORKER_API_KEY:?Set the same key as API MediaWorker__ApiKey}
      AI_SCENE_CONCURRENCY: ${AI_SCENE_CONCURRENCY:-1}
      MEDIA_QUEUE_MODE: ${MEDIA_QUEUE_MODE:-polling}
      MEDIA_QUEUE_REDIS_URL: ${MEDIA_QUEUE_REDIS_URL:-redis://redis-media:6379}
      MEDIA_QUEUE_STREAM: ${MEDIA_QUEUE_STREAM:-apcs:dev:media:jobs}
    extra_hosts:
      - host.docker.internal:host-gateway
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    security_opt:
      - no-new-privileges:true

  redis-media:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - media_queue_redis_data:/data

volumes:
  media_queue_redis_data:
